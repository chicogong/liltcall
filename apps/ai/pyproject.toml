[project]
name = "liltcall-ai-spike"
version = "0.1.0"
description = "Local-only WebRTC voice-agent prototype for LiltCall"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pipecat-ai[webrtc]==1.8.0",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
local = [
  "pipecat-ai[openai,pocket-tts,silero,whisper]==1.8.0",
  "mlx-whisper~=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
cloud = [
  "pipecat-ai[openai,silero]==1.8.0",
  "tencentcloud-sdk-python-asr>=3.0,<4",
  "tencentcloud-sdk-python-tts>=3.0,<4",
  "websockets>=17,<18",
]

[tool.uv]
package = false
