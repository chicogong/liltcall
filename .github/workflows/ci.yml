name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-mvp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:docs
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

  offline-ai-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LILTCALL_AI_CLOUD_ALLOW_BILLING: '0'
      LILTCALL_AI_REALTIME_ALLOW_BILLING: '0'
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.6.9'
          python-version: '3.12'
      - run: uv sync --locked --extra cloud
      - run: uv run --locked --extra cloud python -m unittest discover -s . -p 'test_*.py' -v
